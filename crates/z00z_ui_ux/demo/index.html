<!DOCTYPE html>
<html lang="en" data-palette="z00z-default">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#081019">
    <meta name="description" content="Interactive UI/UX concept for the Z00Z private wallet.">
    <meta name="application-name" content="Z00Z Wallet">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest?v=2">
    <link rel="icon" type="image/png" href="assets/logo/z00z-logo-gold-circle.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/logo/z00z-apple-touch-icon-v2-180.png">
    <title>Z00Z Wallet</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to wallet content</a>

    <section class="lock-screen" id="lock-screen" aria-labelledby="lock-title" hidden>
      <div class="lock-card">
        <div class="brand brand-centered">
          <img class="brand-mark" src="assets/logo/z00z-logo-gold-circle.png" alt="">
          <span>Z00Z</span>
        </div>
        <div class="lock-icon"><svg class="icon"><use href="#i-lock"/></svg></div>
        <p class="eyebrow">Private wallet</p>
        <h1 id="lock-title">Welcome back</h1>
        <p class="muted" id="lock-wallet-label">Everyday wallet <span aria-hidden="true">·</span> <span class="mono">8F2A…71C0</span></p>
        <form id="unlock-form" autocomplete="off" data-form-type="other" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" data-protonpass-ignore="true" novalidate>
          <label class="field-label" for="unlock-password">Wallet password</label>
          <div class="password-wrap">
            <input id="unlock-password" name="walletUnlockSecret" type="text" class="secure-entry" data-secure-entry data-port-control="secure-entry" inputmode="text" autocomplete="section-z00z-unlock one-time-code" autocapitalize="none" autocorrect="off" spellcheck="false" data-form-type="other" data-1p-ignore="true" data-lpignore="true" data-bwignore="true" data-protonpass-ignore="true" minlength="4" required>
            <button class="icon-button field-icon" type="button" data-toggle-password aria-label="Show password">
              <svg class="icon"><use href="#i-eye"/></svg>
            </button>
          </div>
          <p class="field-error" id="unlock-error" role="alert"></p>
          <button class="button button-primary button-full" type="submit">
            <svg class="icon"><use href="#i-lock"/></svg> Unlock wallet
          </button>
        </form>
        <button class="button button-quiet button-full" type="button" data-demo-action="switch-wallet">Switch wallet</button>
        <p class="lock-note"><svg class="icon"><use href="#i-shield"/></svg> Session data is cleared when the wallet locks.</p>
      </div>
    </section>

    <div class="app-shell" id="app-shell">
      <header class="topbar" id="primary-topbar">
        <div class="desktop-topbar-brand brand" aria-label="Z00Z">
          <img class="brand-mark" src="assets/logo/z00z-logo-gold-circle.png" alt="">
          <span>Z00Z</span>
        </div>
        <section class="wallet-identity" id="wallet-identity" aria-label="Active wallet" aria-live="polite"></section>
        <div class="mobile-navigation-leading">
          <button class="icon-button mobile-menu-button" id="mobile-menu-button" type="button" aria-controls="mobile-popup-menu" aria-expanded="false">
            <svg class="icon"><use href="#i-menu"/></svg>
          </button>
          <span class="mobile-nav-brand" role="img" aria-label="Z00Z">
            <img src="assets/logo/z00z-logo-gold-circle.png" alt="">
          </span>
        </div>
        <section class="mobile-active-wallet" id="mobile-active-wallet" aria-label="Active wallet" hidden></section>
        <div class="mobile-topbar-context" id="mobile-topbar-context" aria-label="Current section" hidden></div>
        <div class="topbar-address-group">
          <div class="page-heading">
            <p class="route-breadcrumb" id="route-breadcrumb" aria-label="Current path"></p>
            <h1 id="page-title">Home</h1>
            <p id="page-context" hidden></p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-button topbar-search" id="menu-search-trigger" type="button" aria-haspopup="dialog" aria-controls="menu-search-dialog" aria-expanded="false">
            <svg class="icon"><use href="#i-search"/></svg>
          </button>
          <button class="icon-button" type="button" data-demo-action="toggle-balance" aria-label="Hide sensitive amounts" title="Hide sensitive amounts">
            <svg class="icon"><use href="#i-eye"/></svg>
          </button>
          <button class="icon-button topbar-notification" type="button" data-demo-action="notifications" aria-label="Notifications, one unread" title="Notifications">
            <svg class="icon"><use href="#i-bell"/></svg><span class="notification-dot"></span>
          </button>
        </div>
      </header>

      <div class="app-body" id="app-body">
        <aside class="sidebar" aria-label="Primary navigation">
        <p class="sidebar-label" data-i18n="app.wallets">Wallets</p>
        <div class="wallet-nav-viewport">
          <nav class="wallet-nav" id="wallet-nav" aria-label="Wallets"></nav>
        </div>
        <div class="sidebar-navigation-scroll-region">
          <nav class="app-navigation-tree" id="app-navigation-tree" aria-label="Application navigation"></nav>
          <nav class="app-navigation-terminal" id="app-navigation-terminal" aria-label="Application actions"></nav>
        </div>
        </aside>

        <div class="app-column">
        <main class="main-content" id="main-content" tabindex="-1"></main>
        <div class="context-help-host" id="context-help-host"></div>
        <footer class="wallet-statusbar" id="wallet-statusbar" aria-label="Selected wallet status"></footer>
        </div>
      </div>
      <button class="mobile-menu-backdrop" id="mobile-menu-backdrop" type="button" tabindex="-1" aria-label="Close menu" hidden></button>
      <div class="mobile-popup-menu" id="mobile-popup-menu" role="dialog" hidden></div>
      <div class="wallet-picker-popup" id="wallet-picker-popup" role="menu" hidden></div>
    </div>

    <div class="menu-search-overlay" id="menu-search-overlay" hidden>
      <div class="menu-search-backdrop" id="menu-search-backdrop" aria-hidden="true"></div>
      <section class="menu-search-dialog" id="menu-search-dialog" role="dialog" aria-modal="true" aria-labelledby="menu-search-title" tabindex="-1">
        <div class="menu-search-dialog-header">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <h2 class="visually-hidden" id="menu-search-title">Search</h2>
          <label class="visually-hidden" id="menu-search-label" for="menu-search-input">Search</label>
          <input id="menu-search-input" type="search" autocomplete="off" maxlength="80">
          <button class="menu-search-close" id="menu-search-close" type="button">Esc</button>
        </div>
        <p class="visually-hidden" id="menu-search-status" role="status" aria-live="polite"></p>
        <div class="menu-search-results" id="menu-search-results"></div>
      </section>
    </div>

    <dialog class="flow-dialog" id="flow-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="scripts/port/locale-registry.js"></script>
    <script src="i18n.js"></script>
    <script src="locales/en.js"></script>
    <script src="locales/ru.js"></script>
    <script src="locales/fr.js"></script>
    <script src="locales/de.js"></script>
    <script src="locales/es.js"></script>
    <script src="locales/pt.js"></script>
    <script src="locales/ko.js"></script>
    <script src="locales/tr.js"></script>
    <script src="locales/ja.js"></script>
    <script src="locales/zh-Hans.js"></script>
    <script src="locales/send-exchange.js"></script>
    <script src="locales/navigation.js"></script>
    <script src="locales/demo-plan-2.js"></script>
    <script src="scripts/generated/help-catalog.js"></script>
    <script src="scripts/port/help-registry.js"></script>
    <script src="scripts/help-controller.js"></script>
    <script src="scripts/port/contracts.js"></script>
    <script src="scripts/port/icon-sprite.js"></script>
    <script src="scripts/port/ui-primitives.js"></script>
    <script src="scripts/port/icon-registry.js"></script>
    <script src="scripts/port/navigation-model.js"></script>
    <script src="scripts/port/navigation-session.js"></script>
    <script src="scripts/port/exchange-catalog.js"></script>
    <script src="scripts/port/dapp-catalog.js"></script>
    <script src="scripts/port/messenger-catalog.js"></script>
    <script src="scripts/port/contacts-catalog.js"></script>
    <script src="scripts/port/fixtures.js"></script>
    <script src="scripts/port/presentation-state.js"></script>
    <script src="scripts/port/mock-wallet-gateway.js"></script>
    <script src="scripts/port/mock-telemetry-gateway.js"></script>
    <script src="scripts/port/mock-dapp-gateway.js"></script>
    <script src="scripts/port/mock-messenger-gateway.js"></script>
    <script src="scripts/port/mock-contacts-gateway.js"></script>
    <script src="app.js"></script>
  </body>
</html>
