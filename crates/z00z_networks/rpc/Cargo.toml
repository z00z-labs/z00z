[package]
name = "z00z_networks_rpc"
version = "0.1.0"
edition = "2021"
authors = ["Z00Z Development Team"]
description = "Generic RPC transport layer for Z00Z network protocols"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"] # Support both WASM and native
doctest = false

# ============================================================================
# Base Dependencies (Native + WASM)
# ============================================================================

[dependencies]
# Async runtime
async-trait = { version = "0.1", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Error handling
thiserror = { version = "2.0", optional = true }

# Shared codec and transport value surface.
[dependencies.z00z_utils]
path = "../../z00z_utils"
optional = true

# ============================================================================
# Native-Only Dependencies
# ============================================================================

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Full tokio for native
tokio = { version = "1", features = ["full"], optional = true }

# JSON-RPC with full features
jsonrpsee = { version = "0.26", features = ["server", "client", "macros"], optional = true }

# Logging
tracing = { version = "0.1", optional = true }

# ============================================================================
# WASM-Specific Dependencies
# ============================================================================

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Minimal tokio for WASM (no I/O, no mio, no net)
tokio = { version = "1", default-features = false, features = [
  "sync",
  "macros",
  "rt",
], optional = true }

# JSON-RPC with WASM client only
jsonrpsee = { version = "0.26", default-features = false, features = [
  "wasm-client",
], optional = true }

# WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["MessageEvent", "WebSocket"], optional = true }
js-sys = { version = "0.3", optional = true }

# WASM-compatible RNG
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

# WASM testing
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# ============================================================================
# Features
# ============================================================================

[features]
default = ["dynamic-rpc"]
# Legacy method/value JSON-RPC surface. Closed typed consumers disable default
# features and use only TypedRpcTransport.
dynamic-rpc = [
  "dep:async-trait",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:z00z_utils",
  "dep:tokio",
  "dep:jsonrpsee",
  "dep:tracing",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "dep:js-sys",
  "dep:getrandom",
]
# Reserved feature gate for transport-local logger integrations.
logger = ["dynamic-rpc"]
