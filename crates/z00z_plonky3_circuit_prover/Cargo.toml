[package]
# Z00Z owns one canonical Plonky3 proof backend. It contains the circuit prover
# and the FRI-recursive verifier used by Phase 069; no compatibility package,
# alias dependency, or separate recursion crate exists.
name = "z00z_plonky3_circuit_prover"
description = "Canonical Z00Z Plonky3 circuit prover and FRI-recursive verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/z00z-labs/z00z"
homepage = "https://z00z.io"
keywords = ["cryptography", "SNARK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

# Display math equations properly in documentation
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", ".cargo/katex-header.html"]

[dependencies]
hashbrown.workspace = true
itertools.workspace = true
p3-air.workspace = true
p3-baby-bear.workspace = true
p3-batch-stark.workspace = true
p3-challenger.workspace = true
p3-circle.workspace = true
p3-circuit.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-fri.workspace = true
p3-goldilocks.workspace = true
p3-keccak.workspace = true
p3-koala-bear.workspace = true
p3-lookup.workspace = true
p3-matrix.workspace = true
p3-maybe-rayon.workspace = true
p3-merkle-tree.workspace = true
p3-poseidon-circuit-cols.workspace = true
p3-poseidon1-air.workspace = true
p3-poseidon1-circuit-air.workspace = true
p3-poseidon2.workspace = true
p3-poseidon2-air.workspace = true
p3-poseidon2-circuit-air.workspace = true
p3-symmetric.workspace = true
p3-uni-stark.workspace = true
p3-util.workspace = true
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
rand.workspace = true
serde.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true
unroll.workspace = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
p3-batch-stark.workspace = true
p3-test-utils = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "b36339709a7a67ee9760fb578b3d4339fd983709" }
proptest = "1.5"
rand.workspace = true
tracing-forest = { version = "0.3.1", features = ["smallvec"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "env-filter"] }

[features]
parallel = ["p3-maybe-rayon/parallel", "p3-circuit/parallel"]

[[bench]]
name = "prover"
harness = false

[lints]
workspace = true

[[example]]
name = "fibonacci"
path = "examples/fibonacci.rs"

[[example]]
name = "poseidon2_perm_chain"
path = "examples/poseidon2_perm_chain.rs"

[[example]]
name = "poseidon2_perm_merkle"
path = "examples/poseidon2_perm_merkle.rs"
